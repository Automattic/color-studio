name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build docs
        run: yarn docs

      - name: Generate examples index
        run: |
          EXAMPLES_DIR="docs/dist/examples"
          INDEX_FILE="$EXAMPLES_DIR/index.html"
      
          echo "<!DOCTYPE html>" > $INDEX_FILE
          echo "<html><head><meta charset='utf-8'><title>Examples</title></head><body>" >> $INDEX_FILE
          echo "<h1>Examples</h1><ul>" >> $INDEX_FILE
      
          for f in $(find "$EXAMPLES_DIR" -maxdepth 1 -type f -name '*.html' ! -name 'index.html' | sort); do
            name=$(basename "$f")
            echo "<li><a href=\"$name\">$name</a></li>" >> $INDEX_FILE
          done
      
          echo "</ul></body></html>" >> $INDEX_FILE
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
