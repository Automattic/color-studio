version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:lts

commands:
  public_checkout:
    steps:
      - run:
          name: Checkout public repo over HTTPS
          command: |
            git clone --depth=1 https://github.com/Automattic/color-studio.git .
            git fetch --depth=1 origin "$CIRCLE_SHA1" || true
            git checkout -q "$CIRCLE_SHA1" || true
            
jobs:
  build:
    executor: node
    steps:
      - public_checkout
      - run: yarn --ignore-engines --ignore-platform
      - run: yarn palette:build

  lint:
    executor: node
    steps:
      - public_checkout
      - run: yarn --ignore-engines --ignore-platform
      - run: yarn lint

  no-uncommitted-color-changes:
    executor: node
    steps:
      - public_checkout
      - run:
          name: Cache color values
          command: |
            mkdir -p .cache
            cp dist/colors.json .cache
      - run: yarn --ignore-engines --ignore-platform
      - run: yarn palette:build:json
      - run:
          name: Compare color values
          command: cmp .cache/colors.json dist/colors.json

workflows:
  version: 2
  main:
    jobs:
      - build
      - lint
      - no-uncommitted-color-changes
